apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: inventory/backend:latest
          envFrom:
            - configMapRef:
                name: inventory-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: inventory
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
